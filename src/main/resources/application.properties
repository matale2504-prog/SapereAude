# Nombre de la aplicación
spring.application.name=SmartEduAndConsult

# Conexión a la Base de Datos (toma variables de entorno en Render, o usa localhost por defecto)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sapereaude_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto de la aplicación
server.port=${PORT:8080}